      <p class="hero__lead reveal">
        Software Engineer with 9+ years of experience in Digital Transformation,
        and Technical Lead for Digital Product Management.

    <footer class="hero__footer">© <span id="year">2026</span> Mohammed Alshehri</footer>
  </main>

  <dialog class="contact" id="contact" aria-labelledby="contact-title">
    <form class="contact__form" id="contact-form" novalidate>
      <header class="contact__header">
        <div>
          <h2 id="contact-title">Let's talk</h2>
          <p>I'll get back to you as soon as possible.</p>
        </div>
        <button type="button" class="contact__close" data-close-contact aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </header>

      <div class="field-row">
        <div class="field">
          <label for="name">Full name</label>
          <input id="name" name="name" type="text" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
      </div>
      <div class="field">
        <label for="title">Subject</label>
        <input id="title" name="title" type="text" required>
      </div>
      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" required></textarea>
      </div>

      <!-- Honeypot: invisible to people, bots tend to fill it in -->
      <div class="hp" aria-hidden="true">
        <label for="company">Company</label>
        <input id="company" name="company" type="text" tabindex="-1" autocomplete="off">
      </div>

      <p class="contact__status" id="contact-status" role="status" aria-live="polite"></p>

      <button type="submit" class="btn btn--primary btn--block" id="contact-submit">Send message</button>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js" defer></script>
  <script src="assets/js/main.js" defer></script>
